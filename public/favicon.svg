<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="SS pirate icon">
  <defs>
    <!-- Wood radial + linear grain -->
    <radialGradient id="woodRad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a86c3a"/>
      <stop offset="60%" stop-color="#8b5a2b"/>
      <stop offset="100%" stop-color="#5a3718"/>
    </radialGradient>

    <linearGradient id="grain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.06)"/>
      <stop offset="20%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="40%" stop-color="rgba(0,0,0,0.04)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.06)"/>
    </linearGradient>

    <!-- subtle noise-like grain using repeated narrow rectangles -->
    <pattern id="woodGrainPattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-15)">
      <rect width="2" height="10" x="0" y="0" fill="rgba(0,0,0,0.04)"/>
    </pattern>

    <!-- Rope stroke gradient (two-tone) -->
    <linearGradient id="ropeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d2b48c"/>
      <stop offset="40%" stop-color="#c9a06d"/>
      <stop offset="60%" stop-color="#b58952"/>
      <stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>

    <!-- gold gradient for letters -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd970"/>
      <stop offset="45%" stop-color="#f0b83a"/>
      <stop offset="100%" stop-color="#b77a16"/>
    </linearGradient>

    <!-- subtle inset (inner shadow) filter -->
    <filter id="insetShadow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- darken edges -->
      <feOffset dx="0" dy="6" result="o"/>
      <feGaussianBlur in="o" stdDeviation="10" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="arithmetic" k2="-1" k3="1" result="inner"/>
      <feBlend in="SourceGraphic" in2="inner"/>
    </filter>

    <!-- soft drop shadow -->
    <filter id="softDrop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- central serif-like fallback looks piratey (system fonts) -->
    <!-- NOTE: for guaranteed typography, convert text to outlines before shipping -->
  </defs>

  <!-- background (dark sea) -->
  <rect width="100%" height="100%" fill="#031323"/>

  <!-- outer rope ring (stroke with dash to emulate twist) -->
  <g filter="url(#softDrop)">
    <circle cx="512" cy="512" r="420" fill="none" stroke="url(#ropeGrad)" stroke-width="56" stroke-linecap="round" stroke-dasharray="22 18" stroke-linejoin="round"/>
  </g>

  <!-- wooden badge -->
  <g transform="translate(0,0)" filter="url(#insetShadow)">
    <circle cx="512" cy="512" r="330" fill="url(#woodRad)"/>
    <!-- wood grain overlay -->
    <circle cx="512" cy="512" r="330" fill="url(#woodGrainPattern)" opacity="0.28"/>
    <circle cx="512" cy="512" r="328" fill="url(#grain)" opacity="0.22"/>
    <!-- subtle bevel rim -->
    <circle cx="512" cy="512" r="330" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="6"/>
    <circle cx="512" cy="512" r="318" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  </g>

  <!-- optional faint nails (decorative) -->
  <g fill="#b07a3a" opacity="0.95">
    <circle cx="512" cy="160" r="10"/>
    <circle cx="512" cy="864" r="10"/>
    <circle cx="160" cy="512" r="10"/>
    <circle cx="864" cy="512" r="10"/>
  </g>

  <!-- central "SS" (two-layered for carved/embossed look) -->
  <!-- shadowed copy -->
  <text x="512" y="631" text-anchor="middle" font-family="Cinzel, Georgia, 'Times New Roman', serif" font-weight="700" font-size="320" fill="#2b1f16" style="letter-spacing:6px;">
    SS
  </text>

  <!-- bright gold front -->
  <text x="512" y="619" text-anchor="middle" font-family="Cinzel, Georgia, 'Times New Roman', serif" font-weight="800" font-size="320" fill="url(#gold)" style="letter-spacing:6px;">
    SS
  </text>

  <!-- small inner highlight to mimic carved engraving -->
  

  <!-- accessibility title (visible to screen readers) -->
  <title>SS Pirate Icon</title>
</svg>
